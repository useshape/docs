name: Sync from Shape

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: useshape/Shape
          path: upstream
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
      - name: Copy docs
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            --exclude '.mintignore' \
            --exclude 'AGENTS.md' \
            --exclude 'upstream/' \
            upstream/docs/ ./
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Docs already match the Shape repository."
            exit 0
          fi
          git commit -m "docs: sync from useshape/Shape"
          git push